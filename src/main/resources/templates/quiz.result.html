<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quiz Results</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5 text-center">
    <div class="card shadow-sm p-5 mx-auto" style="max-width: 600px;">
        <h2 class="text-success mb-3">Quiz Submitted Successfully!</h2>
        <h4 class="text-secondary" th:text="${quiz.title}"></h4>

        <div class="my-4">
            <h3>Your Score: <span class="text-primary" th:text="${correctAnswers}"></span> / <span th:text="${totalQuestions}"></span></h3>
            <p class="fs-5 text-muted" th:text="'Percentage: ' + ${scorePercentage} + '%'"></p>
        </div>

        <a href="/view/student/dashboard" class="btn btn-primary btn-lg mt-3">Back to Available Quizzes</a>
    </div>
</div>

</body>
</html>
