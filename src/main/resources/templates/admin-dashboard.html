<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Exam Portal - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Exam Portal Admin</a>
        <span class="navbar-text text-white" th:if="${user != null}">
                Welcome, <strong th:text="${user.username}">Admin</strong>
            </span>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-md-5 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0">Add New Quiz</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/view/admin/quizzes/save}" th:object="${quiz}" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Quiz Title</label>
                            <input type="text" th:field="*{title}" class="form-control" placeholder="e.g. Java Fundamentals" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Enter quiz details..."></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Max Marks</label>
                                <input type="number" th:field="*{maxMarks}" class="form-control" placeholder="100" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Number of Questions</label>
                                <input type="number" th:field="*{numberOfQuestions}" class="form-control" placeholder="10" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select th:field="*{category.id}" class="form-select" required>
                                <option value="" disabled selected>-- Select Category --</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.title}"></option>
                            </select>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeCheck">
                            <label class="form-check-label" for="activeCheck">Publish / Active</label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Save Quiz</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0">Available Quizzes</h5>
                    <span class="badge bg-secondary" th:text="${#lists.size(quizzes) + ' Total'}">0 Total</span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Marks</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="q : ${quizzes}">
                                <td>
                                    <strong th:text="${q.title}">Java Quiz</strong>
                                    <div class="text-muted small" th:text="${q.description}">Description</div>
                                </td>
                                <td>
                                    <span class="badge bg-info text-dark" th:text="${q.category != null ? q.category.title : 'Uncategorized'}">Category</span>
                                </td>
                                <td th:text="${q.maxMarks}">100</td>
                                <td>
                                    <span class="badge bg-success" th:if="${q.active}">Active</span>
                                    <span class="badge bg-warning text-dark" th:unless="${q.active}">Draft</span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/quizzes/delete/{id}(id=${q.qId})}" class="btn btn-sm btn-outline-danger">Delete</a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(quizzes)}">
                                <td colspan="5" class="text-center py-4 text-muted">No quizzes created yet.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
