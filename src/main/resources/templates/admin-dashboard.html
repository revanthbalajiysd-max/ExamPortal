<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Admin Dashboard</h2>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>

    <div class="row mb-5">
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <h4>Add New Category</h4>
                <form th:action="@{/view/admin/categories/save}" th:object="${category}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Category Title</label>
                        <input type="text" class="form-control" th:field="*{title}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" th:field="*{description}" rows="2" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Category</button>
                </form>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <h4>Add New Quiz</h4>
                <form th:action="@{/view/admin/quizzes/save}" th:object="${quiz}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Quiz Title</label>
                        <input type="text" class="form-control" th:field="*{title}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" th:field="*{description}" rows="2" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Add Quiz</button>
                </form>
            </div>
        </div>
    </div>

    <div class="card shadow-sm p-4">
        <h4>Existing Quizzes</h4>

        <div th:if="${quizzes == null || quizzes.empty}" class="alert alert-info mt-3">
            No quizzes available yet. Create one above!
        </div>

        <table class="table table-striped mt-3" th:unless="${quizzes == null || quizzes.empty}">
            <thead>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="q : ${quizzes}">
                <td th:text="${q.title}"></td>
                <td th:text="${q.description}"></td>
                <td>
                    <a th:href="@{'/view/admin/quiz/' + ${q.id} + '/questions'}" class="btn btn-info btn-sm">Manage Questions</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
