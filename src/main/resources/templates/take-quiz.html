<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Exam Portal - Take Quiz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <!-- Quiz Header -->
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h3 th:text="${quiz.title}" class="fw-bold text-primary">Quiz Title</h3>
                    <p th:text="${quiz.description}" class="text-muted mb-2">Quiz Description</p>
                    <hr>
                    <div class="d-flex justify-content-between text-secondary">
                        <span>Max Marks: <strong th:text="${quiz.maxMarks}">100</strong></span>
                        <span>Total Questions: <strong th:text="${#lists.size(questions)}">10</strong></span>
                    </div>
                </div>
            </div>

            <form th:action="@{/quiz/submit}" method="POST">
                <input type="hidden" name="quizId" th:value="${quiz.qId}" />

                <div th:each="q, iterStat : ${questions}" class="card shadow-sm mb-3">
                    <div class="card-header bg-white">
                        <h6 class="mb-0">
                            <span class="badge bg-primary me-2" th:text="${'Q' + iterStat.count}">Q1</span>
                            <span th:text="${q.content}">Question text goes here?</span>
                        </h6>
                    </div>
                    <div class="card-body">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio"
                                   th:name="${'question_' + q.quesId}"
                                   th:value="${q.option1}"
                                   th:id="${'q' + q.quesId + '_opt1'}" required>
                            <label class="form-check-label" th:for="${'q' + q.quesId + '_opt1'}" th:text="${q.option1}">Option 1</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio"
                                   th:name="${'question_' + q.quesId}"
                                   th:value="${q.option2}"
                                   th:id="${'q' + q.quesId + '_opt2'}">
                            <label class="form-check-label" th:for="${'q' + q.quesId + '_opt2'}" th:text="${q.option2}">Option 2</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio"
                                   th:name="${'question_' + q.quesId}"
                                   th:value="${q.option3}"
                                   th:id="${'q' + q.quesId + '_opt3'}">
                            <label class="form-check-label" th:for="${'q' + q.quesId + '_opt3'}" th:text="${q.option3}">Option 3</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio"
                                   th:name="${'question_' + q.quesId}"
                                   th:value="${q.option4}"
                                   th:id="${'q' + q.quesId + '_opt4'}">
                            <label class="form-check-label" th:for="${'q' + q.quesId + '_opt4'}" th:text="${q.option4}">Option 4</label>
                        </div>
                    </div>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-success btn-lg">Submit Exam</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
