<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${quiz.title} + ' - Exam Portal'">Take Quiz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container py-4" style="max-width: 850px;">
    <div class="card shadow-sm mb-4 border-primary">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h3 class="mb-1 text-primary" th:text="${quiz.title}">Quiz Title</h3>
                <p class="text-muted mb-0" th:text="${quiz.description}">Quiz Description</p>
            </div>
            <div class="text-end">
                <span class="badge bg-danger fs-5 p-2" id="timerDisplay">00:00</span>
                <div class="small text-muted mt-1">Time Remaining</div>
            </div>
        </div>
    </div>

    <form id="quizForm" th:action="@{/view/quiz/eval/{qId}(qId=${quiz.id})}" th:object="${submission}" method="post">

        <div th:each="q, iterStat : ${questions}" class="card shadow-sm mb-3">
            <div class="card-body">
                <h5 class="card-title mb-3">
                    <span class="badge bg-secondary me-2" th:text="'Q' + ${iterStat.count}">Q1</span>
                    <span th:utext="${q.content}">Question text here</span>
                </h5>

                <div class="form-check mb-2" th:if="${q.option1 != null and !q.option1.isEmpty()}">
                    <input class="form-check-input" type="radio"
                           th:id="'q_' + ${q.id} + '_opt1'"
                           th:name="|answers[${q.id}]|"
                           th:value="${q.option1}">
                    <label class="form-check-label" th:for="'q_' + ${q.id} + '_opt1'" th:text="${q.option1}">Option 1</label>
                </div>

                <div class="form-check mb-2" th:if="${q.option2 != null and !q.option2.isEmpty()}">
                    <input class="form-check-input" type="radio"
                           th:id="'q_' + ${q.id} + '_opt2'"
                           th:name="|answers[${q.id}]|"
                           th:value="${q.option2}">
                    <label class="form-check-label" th:for="'q_' + ${q.id} + '_opt2'" th:text="${q.option2}">Option 2</label>
                </div>

                <div class="form-check mb-2" th:if="${q.option3 != null and !q.option3.isEmpty()}">
                    <input class="form-check-input" type="radio"
                           th:id="'q_' + ${q.id} + '_opt3'"
                           th:name="|answers[${q.id}]|"
                           th:value="${q.option3}">
                    <label class="form-check-label" th:for="'q_' + ${q.id} + '_opt3'" th:text="${q.option3}">Option 3</label>
                </div>

                <div class="form-check mb-2" th:if="${q.option4 != null and !q.option4.isEmpty()}">
                    <input class="form-check-input" type="radio"
                           th:id="'q_' + ${q.id} + '_opt4'"
                           th:name="|answers[${q.id}]|"
                           th:value="${q.option4}">
                    <label class="form-check-label" th:for="'q_' + ${q.id} + '_opt4'" th:text="${q.option4}">Option 4</label>
                </div>
            </div>
        </div>

        <div class="d-grid gap-2 mt-4 mb-5">
            <button type="submit" class="btn btn-success btn-lg" onclick="return confirm('Are you sure you want to submit your exam?');">
                Submit Exam
            </button>
        </div>
    </form>
</div>

<script th:inline="javascript">
    let totalQuestions = /*[[${questions.size()}]]*/ 5;
    let timeLeft = (totalQuestions > 0 ? totalQuestions : 1) * 60;

    const timerElement = document.getElementById('timerDisplay');
    const quizForm = document.getElementById('quizForm');

    const countdown = setInterval(() => {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

        if (timeLeft <= 0) {
            clearInterval(countdown);
            alert("Time is up! Your exam will be submitted automatically.");
            quizForm.submit();
        }
        timeLeft--;
    }, 1000);
</script>

</body>
</html>
