<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${quiz.title}">Take Quiz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <div class="card shadow-sm p-4 mb-4 bg-primary text-white">
        <h2 th:text="${quiz.title}">Quiz Title</h2>
        <p class="mb-0" th:text="${quiz.description}"></p>
    </div>

    <form action="/view/student/quiz/submit" method="post">
        <input type="hidden" name="quizId" th:value="${quiz.id}" />

        <div class="card shadow-sm p-4 mb-3" th:each="q, stat : ${questions}">
            <h5 class="text-secondary" th:text="'Q' + ${stat.count} + ': ' + ${q.content}">Question Content</h5>

            <div class="form-check mt-2">
                <input class="form-check-input" type="radio" th:name="'question_' + ${q.id}" th:value="${q.option1}" th:id="'q' + ${q.id} + '_opt1'">
                <label class="form-check-label" th:for="'q' + ${q.id} + '_opt1'" th:text="${q.option1}"></label>
            </div>
            <div class="form-check mt-1">
                <input class="form-check-input" type="radio" th:name="'question_' + ${q.id}" th:value="${q.option2}" th:id="'q' + ${q.id} + '_opt2'">
                <label class="form-check-label" th:for="'q' + ${q.id} + '_opt2'" th:text="${q.option2}"></label>
            </div>
            <div class="form-check mt-1">
                <input class="form-check-input" type="radio" th:name="'question_' + ${q.id}" th:value="${q.option3}" th:id="'q' + ${q.id} + '_opt3'">
                <label class="form-check-label" th:for="'q' + ${q.id} + '_opt3'" th:text="${q.option3}"></label>
            </div>
            <div class="form-check mt-1">
                <input class="form-check-input" type="radio" th:name="'question_' + ${q.id}" th:value="${q.option4}" th:id="'q' + ${q.id} + '_opt4'">
                <label class="form-check-label" th:for="'q' + ${q.id} + '_opt4'" th:text="${q.option4}"></label>
            </div>
        </div>

        <button type="submit" class="btn btn-success btn-lg w-100">Submit Quiz</button>
    </form>
</div>

</body>
</html>
