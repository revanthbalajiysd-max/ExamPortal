<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Available Quizzes - Student Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Available Exams & Quizzes</h2>
        <a href="/view/admin" class="btn btn-outline-secondary">Switch to Admin</a>
    </div>

    <div class="row" th:if="${quizzes != null && !quizzes.empty}">
        <div class="col-md-4 mb-4" th:each="quiz : ${quizzes}">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title text-primary" th:text="${quiz.title}">Quiz Title</h5>
                    <p class="card-text text-muted" th:text="${quiz.description}">Description</p>
                    <div class="mt-auto">
                        <a th:href="@{'/view/student/quiz/' + ${quiz.id}}" class="btn btn-success w-100">Start Quiz</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${quizzes == null || quizzes.empty}" class="alert alert-info" role="alert">
        No quizzes are currently available. Please check back later.
    </div>
</div>

</body>
</html>
