<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Exam Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
  <h3 class="text-center mb-4 text-primary">Exam Portal Login</h3>

  <div th:if="${param.error}" class="alert alert-danger" role="alert">
    Invalid username or password.
  </div>
  <div th:if="${param.logout}" class="alert alert-success" role="alert">
    You have been logged out successfully.
  </div>

  <form th:action="@{/do-login}" method="post">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
  </form>

  <div class="text-center">
    <a href="/view/student/dashboard" class="text-decoration-none text-muted">Go to Student Dashboard</a>
  </div>
</div>

</body>
</html>
